; ─────────────────────────────────────────────────────────────
; php2shell 緩和設定（CVE-2026-109618 / CVE-2026-109619・CVSS 9.2 RCE）
; 追加日: 2026-10-21 / 記述訂正: 2026-10-22
;
; PHP の multipart/form-data 解析に RCE。PHP 5.4 以降の全系統が対象で、
; 修正版は 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35。
;
; clinic-reservation は「受信」ファイルアップロードを一切使っていない
; （$_FILES / move_uploaded_file / enctype のいずれもソースに存在しない。
;   src/mail/lib/PHPMailer の multipart は送信メールのMIME組み立て用で無関係）。
; したがって multipart 受信を殺しても機能影響はゼロ。
;
; ⚠️ 重要（2026-10-22 訂正）: ここの file_uploads = Off は
;    php2shell に対する緩和ではない。「二重防御」と書いてあったのは誤り。
;
;    file_uploads = Off が止めるのは「ファイル部分を一時ファイルへ保存すること」
;    だけで、脆弱な rfc1867（multipart）パーサそのものは依然として走る。
;
;    【実証】本番と同一イメージ lab-clinic:latest（PHP 8.5.12・file_uploads=Off）へ
;      Content-Type: multipart/form-data; boundary=XX、ボディに name="a" value="hello"
;      だけを入れて POST した結果:
;        {"file_uploads":"","post":{"a":"hello"},"files":[],"raw_len":0}
;      file_uploads は空（=Off）なのに $_POST が multipart ボディから埋まっており、
;      raw_len=0（php://input も消費済み）＝パーサは確かに動いている。
;      再現手順: 受け口に下記を置き、curl -F a=hello <url> を投げる。
;        <?php echo json_encode([
;          "file_uploads" => ini_get("file_uploads"),
;          "post"         => $_POST,
;          "files"        => $_FILES,
;          "raw_len"      => strlen(file_get_contents("php://input")),
;        ]);
;
;    → php2shell に対する実効的な遮断は、前段 Caddy の 415
;      （oracle-lab/Caddyfile の @multipart）**のみ**が担っている。
;
; 🚨 Caddy の無い設置（onamae 等のレンタルサーバー）へこの ini をそのまま
;    持ち込んでも、php2shell の緩和にはならない。その環境では
;    (a) PHP 本体を修正版へ上げる、(b) .htaccess 等の前段で multipart を弾く、
;    のいずれかが必須。この ini を理由に「対策済み」と判断しないこと。
;
; 以下の設定自体は残す意味がある（ただし php2shell 対策としてではない）:
;   file_uploads                    … 使っていない機能の面を落とす／一時ファイル保存の抑止
;   session.upload_progress.enabled … 同上（セッションへの書き込み経路を減らす）
;   session.use_strict_mode         … セッション固定化（session fixation）対策
; ─────────────────────────────────────────────────────────────
file_uploads = Off
session.upload_progress.enabled = Off
session.use_strict_mode = 1

; ─────────────────────────────────────────────────────────────
; エラー表示とエラーログ
; 追加日: 2026-10-22
;
; 公式 php イメージは php.ini を**一切置かない**（php.ini-production は
; /usr/local/etc/php/ に「サンプル」として置かれるだけで読まれない）。
; そのため php_ini_loaded_file() は空になり、display_errors はコンパイル既定の
; On、log_errors は Off のまま本番が動いていた。実測:
;   display_errors=1 log_errors=0 expose_php=On
;
; 何が起きていたか:
;   - 未認証の誰でも Fatal error のメッセージ・スタックトレース・
;     /var/www/html/... の絶対パスを画面で読めた。
;     再現例: /clinic-reservation/index.php?date[]=x
;             （preg_match() に配列が渡り TypeError → Fatal）
;   - しかも log_errors=Off なので、その攻撃の痕跡は**どこにも残らない**。
;   - 出力が始まってしまうため header() が "headers already sent" になり、
;     リダイレクトで守っている経路（reserve.php の不正日時 → index.php）が壊れる。
;
; 方針:
;   display_errors … 画面には一切出さない。利用者に見せる意味が無く、攻撃者には地図になる。
;   log_errors     … 必ず残す。「出さない」と「記録しない」は別物で、後者は調査不能を意味する。
;   error_log      … /proc/self/fd/2 ＝ Apache の stderr。コンテナの標準エラーに流れるので
;                    `docker compose logs clinic` / `docker logs lab-clinic-1` で読める。
;                    data/ 配下のファイルにしないのは、ログ肥大でディスクを埋める経路を
;                    増やさないため（honeypot.log の教訓。rotation は docker 側に任せる）。
;   expose_php     … X-Powered-By に PHP のパッチ版まで載る。前段 Caddy でも落としているが、
;                    原点直結の経路もありうるので PHP 側でも消す（多層防御）。
;
; ⚠ ローカル開発でエラーを画面で見たい場合も display_errors は戻さないこと。
;   `docker compose logs -f web` に全部出る。
; ─────────────────────────────────────────────────────────────
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL
expose_php = Off
