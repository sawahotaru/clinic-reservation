name: Deploy to lab.4510.be

# このリポジトリの main が更新されたら、まず検査（PHP構文チェック＋秘密ファイル混入チェック、
# ＋**本番用Dockerイメージのビルドと起動確認**）を通し、**すべて通ったときだけ**
# 統合ハブ oracle-lab のデプロイを起動する。
#
# ⚠ 2026-07-29 追加: 以前は php -l だけがゲートで、**Dockerfile.oracle を一度もビルドして
#   いなかった**。Apache設定・.htaccess・管理スラッグ移設はビルド時と起動時にしか効かないため、
#   構文チェックでは公開範囲の事故（AllowOverride の設定ミスで src/ や data/ が見える等）を
#   検出できなかった。image ジョブを足して塞いだ。
# oracle-lab 側 (deploy-oracle.yml) が repository_dispatch: clinic-updated を受け、
# client_payload.service=clinic を見て **clinic サービスだけ** をVMで再ビルド/再起動する。
#
# ※ 既存の onamae 向け deploy.yml とは別物（併存）。lab.4510.be は Oracle VM が本番。
#   onamae デプロイは切り戻し用の旧経路（不要になれば別途整理）。
#
# 必要な設定（1回だけ）: Settings → Secrets and variables → Actions に Secret `OL_DISPATCH_PAT`。
#   値は sawahotaru/oracle-lab へ書き込める PAT（fine-grained: Contents Read and write／classic: repo）。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    name: php -l + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # PHP は構文エラーがそのまま本番の 500 になる（ビルド段が無いので誰も先に気づけない）。
      # 全 .php を lint するのが、この構成で最も効く門番。
      # xargs は 1つでも失敗すれば非ゼロで返るので、それをそのままジョブの失敗にする。
      - name: Lint all PHP files
        run: |
          find . -name '*.php' -not -path './src/mail/lib/*' -print0 | xargs -0 -n1 php -l
          echo "All PHP files parsed cleanly."

      # 公開リポジトリなので、秘密情報がコミットされていないことを毎回確かめる。
      # .gitignore はあくまで「うっかり add」を防ぐだけで、既に追跡済みなら効かない。
      - name: Ensure no secrets are committed
        run: |
          hits=$(git ls-files | grep -iE '(^|/)\.env$|\.htpasswd|\.sqlite($|-)|honeypot_deny\.json|\.pem$|\.key$|id_rsa|id_ed25519' || true)
          if [ -n "$hits" ]; then
            echo "::error::Secret-looking files are tracked in git:"; echo "$hits"; exit 1
          fi
          echo "No secret files tracked."

      # 管理画面は本番では秘密スラッグ配下に移設される。公開ソースに素の admin/ 以外の
      # 経路が増えていないか（隠蔽の前提が崩れていないか）を軽く確認する。
      - name: Sanity-check public layout
        run: |
          test -f public/index.php || { echo "::error::public/index.php is missing"; exit 1; }
          test -d public/admin     || { echo "::error::public/admin/ is missing"; exit 1; }
          echo "Public layout looks sane."

  image:
    name: docker build + 起動確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # 本番(VM)で使うのは docker/Dockerfile.oracle。ここが壊れるとデプロイが失敗するが、
      # PHP構文チェックだけでは検出できない（Apache設定・.htaccess・スラッグ移設は
      # ビルド時と起動時に効くため）。
      - name: Build image (本番用 Dockerfile.oracle)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.oracle
          load: true
          tags: clinic:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ⚠ ADMIN_SLUG は渡さない（CIに秘密値を持ち込まない）。未指定時は /admin/ のまま
      #   Basic認証がかかる仕様なので、ここでは 401 を期待値とする。本番は 404。
      - name: 起動確認と公開範囲の検査
        run: |
          docker run -d --name clinic-ci -p 18081:80 clinic:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:18081/clinic-reservation/ || echo 000)
            if [ "$code" = "200" ]; then echo "  起動成功（約$((i*3))秒）"; break; fi
            sleep 3
          done

          fail=0
          expect() {  # expect <パス> <期待コード> <説明>
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://localhost:18081$1" || echo 000)
            if [ "$code" = "$2" ]; then
              echo "  OK   $1 -> $code ($3)"
            else
              echo "::error::$1 は $2 を期待したが $code だった ($3)"
              fail=1
            fi
          }
          expect /clinic-reservation/       200 "公開ページ"
          expect /clinic-reservation/src/   403 "非公開ディレクトリの拒否"
          expect /clinic-reservation/data/  403 "データディレクトリの拒否"
          expect /clinic-reservation/admin/ 401 "管理画面のBasic認証"

          echo "  PHP: $(docker exec clinic-ci php -v 2>&1 | head -1)"
          [ "$fail" -eq 0 ] || { echo "::error::公開範囲の検査に失敗（.htaccess/AllowOverride の設定を確認）"; exit 1; }

      - name: 起動ログ（失敗時）
        if: failure()
        run: docker logs clinic-ci 2>&1 | tail -120 || true

      - name: 後片付け
        if: always()
        run: docker rm -f clinic-ci || true

  notify:
    name: Trigger oracle-lab deploy
    needs: [check, image]
    # 検査が通った main への push のときだけデプロイする（PR では走らせない）
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger oracle-lab deploy (scoped to clinic)
        env:
          TOKEN: ${{ secrets.OL_DISPATCH_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret OL_DISPATCH_PAT is not set (repo Settings → Secrets → Actions)."
            exit 1
          fi
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sawahotaru/oracle-lab/dispatches \
            -d '{"event_type":"clinic-updated","client_payload":{"service":"clinic","ref":"${{ github.sha }}"}}'
          echo "Dispatched clinic-updated → oracle-lab (deploys clinic only)."
